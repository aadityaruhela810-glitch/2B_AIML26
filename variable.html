<!DOCTYPE html>
<html>
<head>
    <script>
        function sum() {
            let age = parseInt(prompt("Enter your age:"));

            if (age >= 18) {
                alert("You are eligible");
            } else {
                alert("You are not eligible");
            }
        }
    </script>
</head>

<body>
    <input type="button" onclick="sum()" value="Result">
</body>
</html>
